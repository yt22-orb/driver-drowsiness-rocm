[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "driver-drowsiness-rocm"
version = "0.1.0"
description = "ROCm training and portable ONNX inference for driver drowsiness classification"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "datasets>=3.2,<5",
  "numpy>=1.26,<2",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "pillow>=11,<13",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/drowsiness"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
